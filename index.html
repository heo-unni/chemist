<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>카페 매출 대시보드</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
  :root{
    --bg:#eaf3fb;
    --surface:#ffffff;
    --border:#c9dff2;
    --text-primary:#123049;
    --text-secondary:#5b7d97;
    --accent:#3d9bd6;
    --accent-light:#dcedfa;
    --teal:#1d9e75;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    background:var(--bg); color:var(--text-primary); padding:24px;
  }
  header{margin-bottom:24px;}
  header h1{font-size:22px; font-weight:600; margin:0 0 4px;}
  header p{font-size:13px; color:var(--text-secondary); margin:0;}

  .toolbar{
    display:flex; align-items:center; gap:12px; margin-bottom:20px;
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px 16px;
  }
  .toolbar label{font-size:13px; color:var(--text-secondary);}
  select{
    padding:8px 10px; border:1px solid var(--border); border-radius:8px; font-size:14px;
    background:#fff; color:var(--text-primary);
  }
  button{
    padding:8px 14px; border:1px solid var(--border); border-radius:8px; background:#fff;
    color:var(--text-primary); font-size:13px; cursor:pointer;
  }
  button:hover{background:var(--accent-light);}

  .kpi-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(180px,1fr)); gap:12px; margin-bottom:20px;
  }
  .kpi-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px;
  }
  .kpi-card .label{font-size:12px; color:var(--text-secondary); margin-bottom:6px;}
  .kpi-card .value{font-size:24px; font-weight:600; color:var(--accent);}
  .kpi-card .sub{font-size:11px; color:var(--text-secondary); margin-top:4px;}

  .charts-grid{
    display:grid; grid-template-columns:1fr 1fr; gap:16px;
  }
  .chart-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px;
    grid-column: span 1;
  }
  .chart-card.full{grid-column:1 / -1;}
  .chart-card h2{font-size:14px; font-weight:600; margin:0 0 12px;}
  .chart-wrap{position:relative; height:280px;}

  .store-breakdown{font-size:12px; color:var(--text-secondary); margin-top:8px; line-height:1.6;}

  @media (max-width:800px){
    .charts-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <h1>카페 매출 대시보드</h1>
  <p>주문 데이터 기준 매장 운영 현황 · 총 51건</p>
</header>

<div class="toolbar">
  <label for="storeFilter">매장 필터</label>
  <select id="storeFilter"></select>
  <button id="resetBtn">필터 초기화</button>
</div>

<div class="kpi-grid">
  <div class="kpi-card">
    <div class="label">전체 건수</div>
    <div class="value" id="kpiCount">-</div>
    <div class="sub" id="kpiCountSub"></div>
  </div>
  <div class="kpi-card">
    <div class="label">매장별 건수 (선택 기준 최다)</div>
    <div class="value" id="kpiTopStore">-</div>
    <div class="store-breakdown" id="kpiStoreBreakdown"></div>
  </div>
  <div class="kpi-card">
    <div class="label">총 결제금액</div>
    <div class="value" id="kpiSum">-</div>
  </div>
  <div class="kpi-card">
    <div class="label">평균 결제금액</div>
    <div class="value" id="kpiAvg">-</div>
  </div>
</div>

<div class="charts-grid">
  <div class="chart-card">
    <h2>메뉴별 주문건수</h2>
    <div class="chart-wrap"><canvas id="menuChart" role="img" aria-label="메뉴별 주문건수 막대그래프"></canvas></div>
  </div>
  <div class="chart-card">
    <h2>결제금액 분포</h2>
    <div class="chart-wrap"><canvas id="histChart" role="img" aria-label="결제금액 구간별 분포 히스토그램"></canvas></div>
  </div>
  <div class="chart-card full">
    <h2>일자별 매출 추이</h2>
    <div class="chart-wrap"><canvas id="trendChart" role="img" aria-label="일자별 결제금액 합계 추이 선그래프"></canvas></div>
  </div>
</div>

const fmtWon = (v) => '\u20a9' + Math.round(v).toLocaleString('ko-KR');
const fmtInt = (v) => Math.round(v).toLocaleString('ko-KR');

let menuChart, histChart, trendChart;
let currentFilter = '전체';

function uniqueStores(data){
  const set = new Set(data.map(d => d['매장명']));
  return Array.from(set).sort();
}

function populateStoreFilter(){
  const sel = document.getElementById('storeFilter');
  sel.innerHTML = '';
  const optAll = document.createElement('option');
  optAll.value = '전체'; optAll.textContent = '전체 매장';
  sel.appendChild(optAll);
  uniqueStores(RAW_DATA).forEach(s => {
    const opt = document.createElement('option');
    opt.value = s; opt.textContent = s;
    sel.appendChild(opt);
  });
}

function getFilteredData(){
  if(currentFilter === '전체') return RAW_DATA;
  return RAW_DATA.filter(d => d['매장명'] === currentFilter);
}

function updateKPIs(data){
  const total = RAW_DATA.length;
  const filteredCount = data.length;
  document.getElementById('kpiCount').textContent = fmtInt(filteredCount);
  document.getElementById('kpiCountSub').textContent = currentFilter === '전체'
    ? '전체 데이터 기준'
    : `전체 ${total}건 중 ${((filteredCount/total)*100).toFixed(1)}%`;

  const storeCounts = {};
  data.forEach(d => { storeCounts[d['매장명']] = (storeCounts[d['매장명']]||0)+1; });
  const sortedStores = Object.entries(storeCounts).sort((a,b)=>b[1]-a[1]);
  if(sortedStores.length){
    const [topName, topCount] = sortedStores[0];
    document.getElementById('kpiTopStore').textContent = `${topName} (${topCount}건)`;
  } else {
    document.getElementById('kpiTopStore').textContent = '-';
  }
  document.getElementById('kpiStoreBreakdown').innerHTML = sortedStores
    .map(([name,cnt]) => `${name}: ${cnt}건 (${((cnt/filteredCount)*100).toFixed(1)}%)`)
    .join('<br>');

  const sum = data.reduce((acc,d)=>acc + (d['결제금액']||0), 0);
  const avg = filteredCount ? sum/filteredCount : 0;
  document.getElementById('kpiSum').textContent = fmtWon(sum);
  document.getElementById('kpiAvg').textContent = fmtWon(avg);
}

function buildMenuChart(data){
  const counts = {};
  data.forEach(d => { counts[d['메뉴']] = (counts[d['메뉴']]||0)+1; });
  const entries = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const labels = entries.map(e=>e[0]);
  const values = entries.map(e=>e[1]);
  const total = values.reduce((a,b)=>a+b,0);

  if(menuChart) menuChart.destroy();
  menuChart = new Chart(document.getElementById('menuChart'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'주문건수', data: values, backgroundColor:'#3d9bd6', borderRadius:4, maxBarThickness:32 }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:(ctx) => {
              const v = ctx.parsed.y;
              const pct = total ? ((v/total)*100).toFixed(1) : 0;
              return `${ctx.label}: ${v}건 (${pct}%)`;
            }
          }
        }
      },
      scales:{
        y:{ beginAtZero:true, title:{display:true, text:'건수'}, ticks:{color:'#5b7d97'}, grid:{color:'#c9dff2'} },
        x:{ title:{display:true, text:'메뉴'}, ticks:{color:'#5b7d97', autoSkip:false, maxRotation:45}, grid:{display:false} }
      }
    }
  });
}

function buildHistChart(data){
  const values = data.map(d=>d['결제금액']).filter(v=>typeof v === 'number' && !isNaN(v));
  if(values.length === 0){
    if(histChart) histChart.destroy();
    return;
  }
  const min = Math.min(...values), max = Math.max(...values);
  const binCount = 8;
  const binSize = (max - min) / binCount || 1;
  const bins = new Array(binCount).fill(0);
  values.forEach(v => {
    let idx = Math.floor((v - min) / binSize);
    if(idx >= binCount) idx = binCount - 1;
    if(idx < 0) idx = 0;
    bins[idx]++;
  });
  const labels = bins.map((_,i) => {
    const lo = Math.round(min + i*binSize);
    const hi = Math.round(min + (i+1)*binSize);
    return `${lo.toLocaleString('ko-KR')}~${hi.toLocaleString('ko-KR')}`;
  });
  const total = values.length;

  if(histChart) histChart.destroy();
  histChart = new Chart(document.getElementById('histChart'), {
    type:'bar',
    data:{ labels, datasets:[{ label:'건수', data: bins, backgroundColor:'#7fc4ea', borderRadius:4 }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:(ctx) => {
              const v = ctx.parsed.y;
              const pct = total ? ((v/total)*100).toFixed(1) : 0;
              return `구간 ${ctx.label}원: ${v}건 (${pct}%)`;
            }
          }
        }
      },
      scales:{
        y:{ beginAtZero:true, title:{display:true, text:'건수'}, ticks:{color:'#5b7d97'}, grid:{color:'#c9dff2'} },
        x:{ title:{display:true, text:'결제금액 구간(원)'}, ticks:{color:'#5b7d97', autoSkip:false, maxRotation:60, font:{size:10}}, grid:{display:false} }
      }
    }
  });
}

function buildTrendChart(data){
  const byDate = {};
  data.forEach(d => {
    const dateStr = (d['주문일시']||'').split(' ')[0];
    if(!dateStr) return;
    byDate[dateStr] = (byDate[dateStr]||0) + (d['결제금액']||0);
  });
  const labels = Object.keys(byDate).sort();
  const values = labels.map(l => byDate[l]);

  if(trendChart) trendChart.destroy();
  trendChart = new Chart(document.getElementById('trendChart'), {
    type:'line',
    data:{ labels, datasets:[{
      label:'일자별 결제금액 합계', data: values,
      borderColor:'#3d9bd6', backgroundColor:'rgba(61,155,214,0.12)',
      fill:true, tension:0.2, pointRadius:4, pointBackgroundColor:'#3d9bd6'
    }]},
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{
        legend:{display:false},
        tooltip:{
          callbacks:{
            label:(ctx) => `${ctx.label}: ${fmtWon(ctx.parsed.y)}`
          }
        }
      },
      scales:{
        y:{ beginAtZero:true, title:{display:true, text:'결제금액 합계(원)'}, ticks:{color:'#5b7d97', callback:(v)=>Math.round(v).toLocaleString('ko-KR')}, grid:{color:'#c9dff2'} },
        x:{ title:{display:true, text:'주문일자'}, ticks:{color:'#5b7d97'}, grid:{display:false} }
      }
    }
  });
}

function render(){
  const data = getFilteredData();
  updateKPIs(data);
  buildMenuChart(data);
  buildHistChart(data);
  buildTrendChart(data);
}

document.getElementById('storeFilter').addEventListener('change', (e) => {
  currentFilter = e.target.value;
  render();
});
document.getElementById('resetBtn').addEventListener('click', () => {
  currentFilter = '전체';
  document.getElementById('storeFilter').value = '전체';
  render();
});

populateStoreFilter();
render();
</script>
