/* ---------- Reveal ---------- */
function Reveal({ children, className = "", delay = 0 }) {
  const ref = useRef(null);
  const [visible, setVisible] = useState(false);
  useEffect(() => {
    const el = ref.current;
    const obs = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (entry.isIntersecting) {
          setTimeout(() => setVisible(true), delay);
          obs.unobserve(entry.target);
        }
      });
    }, { threshold: 0.15 });
    if (el) obs.observe(el);
    return () => obs.disconnect();
  }, [delay]);
  return <div ref={ref} className={`reveal ${visible ? "is-visible" : ""} ${className}`}>{children}</div>;
}

/* ---------- Modal ---------- */
function Modal({ onClose, children, labelledBy }) {
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    document.body.style.overflow = "hidden";
    return () => { document.removeEventListener("keydown", onKey); document.body.style.overflow = ""; };
  }, [onClose]);
  return (
    <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 md:p-8" role="dialog" aria-modal="true" aria-labelledby={labelledBy}
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className="absolute inset-0 bg-[#0c1730]/60 backdrop-blur-sm"></div>
      <div className="relative card rounded-2xl max-w-2xl w-full max-h-[85vh] overflow-y-auto p-6 md:p-8">
        <button onClick={onClose} aria-label="닫기" className="absolute top-4 right-4 text-[var(--text-muted)] hover:text-[var(--text-heading)] focus-ring rounded-full p-1">
          <Icon name="x" size={22} />
        </button>
        {children}
      </div>
    </div>
  );
}

  const visible = SKILLS.slice(page * perPage, page * perPage + perPage);

  return (
    <section id="skills" className="py-14 md:py-20">
      <Reveal>
        <div className="flex items-end justify-between flex-wrap gap-4 mb-2">
          <div>
            <SectionHeader n="02" titleEn="Skill & Competency" />
            <p className="text-[var(--text-body)]">보유 기술 및 역량</p>
          </div>
          {totalPages > 1 && (
            <div className="flex items-center gap-2">
              <button onClick={() => setPage((p) => (p - 1 + totalPages) % totalPages)} aria-label="이전"
                className="w-9 h-9 rounded-full border border-[var(--border-card)] bg-white flex items-center justify-center text-[var(--text-body)] hover:text-[var(--blue)] hover:border-[var(--blue)] focus-ring">
                <Icon name="chevron-left" size={16} />
              </button>
              <button onClick={() => setPage((p) => (p + 1) % totalPages)} aria-label="다음"
                className="w-9 h-9 rounded-full border border-[var(--border-card)] bg-white flex items-center justify-center text-[var(--text-body)] hover:text-[var(--blue)] hover:border-[var(--blue)] focus-ring">
                <Icon name="chevron-right" size={16} />
              </button>
            </div>
          )}
        </div>
      </Reveal>

      <div className="grid grid-cols-1 gap-5 mt-8">
        {visible.map((skill, i) => (
          <Reveal key={skill.id} delay={i * 100}>
            <button onClick={() => setModalSkill(skill)}
              className="card rounded-2xl p-6 text-left w-full h-full hover:border-[var(--blue)]/50 transition focus-ring">
              <span className="pill inline-block text-xs px-3 py-1.5 rounded-full mb-4">{skill.code}</span>
              <h3 className="font-display text-lg md:text-xl font-bold mb-2">{skill.title}</h3>
              <p className="text-sm text-[var(--text-body)]">{skill.summary}</p>
            </button>
          </Reveal>
        ))}
      </div>

      {totalPages > 1 && (
        <div className="flex justify-center gap-2 mt-6">
          {Array.from({ length: totalPages }).map((_, i) => (
            <button key={i} onClick={() => setPage(i)} aria-label={`${i + 1}페이지`}
              className={`h-2 rounded-full transition-all ${i === page ? "w-6 bg-[var(--blue)]" : "w-2 bg-[var(--border-card)]"}`} />
          ))}
        </div>
      )}

      {modalSkill && (
        <Modal onClose={() => setModalSkill(null)} labelledBy="skill-modal-title">
          <span className="pill inline-block text-xs px-3 py-1.5 rounded-full mb-4">{modalSkill.code}</span>
          <h3 id="skill-modal-title" className="font-display text-2xl font-bold mb-3">{modalSkill.title}</h3>
          <p className="text-[var(--text-body)] leading-relaxed mb-6">{modalSkill.detail}</p>
          <div className="flex flex-wrap gap-2">
            {modalSkill.tags.map((t) => (
              <span key={t} className="text-xs font-medium text-[var(--text-body)] bg-[var(--bg-page)] border border-[var(--border-card)] rounded-full px-3 py-1.5">{t}</span>
            ))}
          </div>
        </Modal>
      )}
    </section>
  );
}

/* ---------- Timeline list (Career / Education) ---------- */
function TimelineList({ items }) {
  return (
    <div>
      {items.map((item, i) => (
        <Reveal key={item.org + item.period} delay={i * 90}>
          <div className="flex gap-4">
            <div className="flex flex-col items-center">
              <span className="timeline-dot mt-1.5 shrink-0"></span>
              {i !== items.length - 1 && <span className="timeline-line flex-1 my-1"></span>}
            </div>
            <div className="pb-8">
              <p className="font-mono text-xs text-[var(--blue)] mb-1">{item.period}</p>
              <h4 className="font-display text-base font-bold mb-0.5">{item.role}</h4>
              <p className="text-sm text-[var(--text-heading)]/80 mb-1.5">{item.org}</p>
              <p className="text-sm text-[var(--text-body)] leading-relaxed">{item.desc}</p>
            </div>
          </div>
        </Reveal>
      ))}
    </div>
  );
}

function Experience() {
  return (
    <section id="experience" className="py-14 md:py-20">
      <Reveal>
        <SectionHeader n="03" titleEn="Career & Education" />
        <p className="text-[var(--text-body)] mb-10">경력 및 학력</p>
      </Reveal>
      <div className="grid md:grid-cols-2 gap-10">
        <div>
          <h3 className="font-display text-base font-bold mb-6 flex items-center gap-2">
            <Icon name="briefcase" size={16} className="text-[var(--blue)]" /> 주요 경력 (Career)
          </h3>
          <TimelineList items={CAREER} />
        </div>
        <div>
          <h3 className="font-display text-base font-bold mb-6 flex items-center gap-2">
            <Icon name="graduation-cap" size={16} className="text-[var(--blue)]" /> 학력 사항 (Education)
          </h3>
          <TimelineList items={EDUCATION} />
        </div>
      </div>
    </section>
  );
}

/* ---------- Projects ---------- */
function Projects() {
  const [filter, setFilter] = useState("전체");
  const [modalProject, setModalProject] = useState(null);
  const filtered = useMemo(() => filter === "전체" ? PROJECTS : PROJECTS.filter((p) => p.tags.includes(filter)), [filter]);

  return (
    <section id="projects-section" className="py-14 md:py-20">
      <Reveal>
        <SectionHeader n="04" titleEn="Research Projects" />
        <p className="text-[var(--text-body)] mb-6">연구 프로젝트</p>
        <div className="flex flex-wrap gap-2 mb-10">
          {PROJECT_FILTERS.map((f) => (
            <button key={f} onClick={() => setFilter(f)}
              className={`text-sm px-4 py-2 rounded-full border transition focus-ring ${filter === f ? "bg-[var(--blue)] border-[var(--blue)] text-white" : "bg-white border-[var(--border-card)] text-[var(--text-body)] hover:border-[var(--blue)] hover:text-[var(--blue)]"}`}>
              {f}
            </button>
          ))}
        </div>
      </Reveal>

      <div className="grid md:grid-cols-3 gap-5">
        {filtered.map((p, i) => (
          <Reveal key={p.id} delay={i * 100}>
            <button onClick={() => setModalProject(p)}
              className="card rounded-2xl p-6 text-left h-full w-full flex flex-col hover:border-[var(--blue)]/50 transition focus-ring">
              <div className="flex flex-wrap gap-2 mb-4">
                {p.tags.map((t) => <span key={t} className="pill text-xs px-3 py-1 rounded-full">{t}</span>)}
              </div>
              <h3 className="font-display text-base font-bold mb-2 leading-snug">{p.title}</h3>
              <p className="text-xs font-mono text-[var(--text-muted)] mt-auto pt-4">{p.period}</p>
            </button>
          </Reveal>
        ))}
      </div>

      {modalProject && (
        <Modal onClose={() => setModalProject(null)} labelledBy="project-modal-title">
          <p className="font-mono text-xs text-[var(--blue)] mb-2">{modalProject.period}</p>
          <h3 id="project-modal-title" className="font-display text-xl font-bold mb-6">{modalProject.title}</h3>
          <div className="space-y-5">
            {[["배경", modalProject.background], ["목적", modalProject.purpose], ["방법론", modalProject.method], ["결과", modalProject.result], ["성과", modalProject.outcome]].map(([label, text]) => (
              <div key={label}>
                <p className="text-xs font-bold text-[var(--blue)] uppercase mb-1">{label}</p>
                <p className="text-sm text-[var(--text-body)] leading-relaxed">{text}</p>
              </div>
            ))}
          </div>
        </Modal>
      )}
    </section>
  );
}

/* ---------- Publications ---------- */
function Publications() {
  const years = useMemo(() => ["전체", ...Array.from(new Set(PUBLICATIONS.map((p) => p.year))).sort((a, b) => b - a)], []);
  const [year, setYear] = useState("전체");
  const [type, setType] = useState("전체");
  const filtered = PUBLICATIONS.filter((p) => (year === "전체" || p.year === year) && (type === "전체" || p.type === type));

  return (
    <section id="publications" className="py-14 md:py-20">
      <Reveal>
        <SectionHeader n="05" titleEn="Publications & Patents" />
        <p className="text-[var(--text-body)] mb-6">논문 및 특허</p>
        <div className="flex flex-wrap items-center justify-between gap-4 mb-8">
          <div className="flex gap-2">
            {["전체", "논문", "발표"].map((t) => (
              <button key={t} onClick={() => setType(t)}
                className={`text-sm px-4 py-2 rounded-full border transition focus-ring ${type === t ? "bg-[var(--blue)] border-[var(--blue)] text-white" : "bg-white border-[var(--border-card)] text-[var(--text-body)] hover:border-[var(--blue)] hover:text-[var(--blue)]"}`}>
                {t}
              </button>
            ))}
          </div>
          <div className="flex flex-wrap gap-2">
            {years.map((y) => (
              <button key={y} onClick={() => setYear(y)}
                className={`font-mono text-xs px-3 py-1.5 rounded-full border transition focus-ring ${year === y ? "border-[var(--blue)] text-[var(--blue)] bg-[var(--blue-soft-bg)]" : "border-[var(--border-card)] bg-white text-[var(--text-muted)] hover:text-[var(--blue)]"}`}>
                {y}
              </button>
            ))}
          </div>
        </div>
      </Reveal>

      <div className="grid gap-3">
        {filtered.map((pub, i) => (
          <Reveal key={pub.title} delay={i * 60}>
            <a href={pub.link} target="_blank" rel="noopener noreferrer"
              className="card rounded-xl p-5 flex items-center justify-between gap-4 hover:border-[var(--blue)]/50 transition group focus-ring">
              <div className="flex items-center gap-4 min-w-0">
                <span className="font-mono text-xs text-[var(--blue)] shrink-0">{pub.year}</span>
                <span className="text-xs font-medium shrink-0 bg-[var(--bg-page)] border border-[var(--border-card)] rounded-full px-2.5 py-1 text-[var(--text-body)]">{pub.type}</span>
                <div className="min-w-0">
                  <p className="text-sm font-medium truncate">{pub.title}</p>
                  <p className="text-xs text-[var(--text-muted)] truncate">{pub.venue}</p>
                </div>
              </div>
              <Icon name="external-link" size={15} className="text-[var(--text-muted)] group-hover:text-[var(--blue)] shrink-0" />
            </a>
          </Reveal>
        ))}
        {filtered.length === 0 && <p className="text-[var(--text-muted)] text-center py-10">해당하는 항목이 없습니다.</p>}
      </div>
    </section>
  );
}

/* ---------- Awards ---------- */
function Awards() {
  return (
    <section id="awards" className="py-14 md:py-20">
      <Reveal>
        <SectionHeader n="06" titleEn="Awards" />
        <p className="text-[var(--text-body)] mb-10">수상내역</p>
      </Reveal>
      <div className="grid md:grid-cols-3 gap-5">
        {AWARDS.map((a, i) => (
          <Reveal key={a.title} delay={i * 100}>
            <div className="card rounded-2xl p-6 h-full flex flex-col gap-2">
              <Icon name="award" size={18} className="text-[var(--blue)]" />
              <p className="font-mono text-xs text-[var(--text-muted)] mt-2">{a.year}</p>
              <h4 className="font-display text-base font-bold">{a.title}</h4>
              <p className="text-sm text-[var(--text-body)]">{a.org}</p>
            </div>
          </Reveal>
        ))}
      </div>
    </section>
  );
}

/* ---------- Contact ---------- */
function Contact() {
  return (
    <section id="contact" className="py-14 md:py-24">
      <Reveal>
        <SectionHeader n="07" titleEn="Contact" />
        <p className="text-[var(--text-body)] mb-10">공동 연구, 채용, 협업 제안 모두 환영합니다.</p>
      </Reveal>
      <div className="grid md:grid-cols-3 gap-5">
        {[
          { icon: "mail", label: "이메일", value: "yuhui.heo@example.ac.kr", href: "mailto:yuhui.heo@example.ac.kr" },
          { icon: "phone", label: "연락처", value: "010-0000-0000", href: "tel:01000000000" },
          { icon: "linkedin", label: "LinkedIn", value: "linkedin.com/in/yuhui-heo", href: "#" },
        ].map((c, i) => (
          <Reveal key={c.label} delay={i * 100}>
            <a href={c.href} className="card rounded-2xl p-6 flex items-center gap-4 hover:border-[var(--blue)]/50 transition focus-ring">
              <div className="w-10 h-10 rounded-lg bg-[var(--blue-soft-bg)] flex items-center justify-center shrink-0">
                <Icon name={c.icon} size={18} className="text-[var(--blue)]" />
              </div>
              <div className="min-w-0">
                <p className="text-xs text-[var(--text-muted)]">{c.label}</p>
                <p className="text-sm font-medium truncate">{c.value}</p>
              </div>
            </a>
          </Reveal>
        ))}
      </div>
    </section>
  );
}

/* ---------- Footer ---------- */
function Footer() {
  const [showTop, setShowTop] = useState(false);
  useEffect(() => {
    const onScroll = () => setShowTop(window.scrollY > 600);
    window.addEventListener("scroll", onScroll);
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  return (
    <footer className="border-t border-[var(--border-card)] mt-4">
      <div className="py-8 flex flex-col md:flex-row items-center justify-between gap-3">
        <p className="text-xs text-[var(--text-muted)]">© 2026 Heo Yuhui. All rights reserved.</p>
        <p className="text-xs text-[var(--text-muted)] font-mono">Last updated 2026.07.31</p>
      </div>
      {showTop && (
        <button onClick={() => window.scrollTo({ top: 0, behavior: "smooth" })} aria-label="맨 위로 이동"
          className="fixed bottom-6 right-6 w-11 h-11 rounded-full bg-[var(--blue)] hover:bg-[var(--blue-dark)] text-white flex items-center justify-center shadow-lg focus-ring">
          <Icon name="arrow-up" size={20} />
        </button>
      )}
    </footer>
  );
}

/* ---------- App ---------- */
function App() {
  return (
    <div className="max-w-[1400px] mx-auto px-4 md:px-6 py-6">
      <div className="grid md:grid-cols-[300px_1fr] gap-6 items-start">
        <Sidebar />
        <main className="min-w-0">
          <MobileNav />
          <About />
          <Skills />
          <Experience />
          <Projects />
          <Publications />
          <Awards />
          <Contact />
          <Footer />
        </main>
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
